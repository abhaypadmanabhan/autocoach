name: CI

# Minimal gate for the dev/main merge flow: backend pytest + frontend
# type-check & lint. Required-check candidates for branch protection on dev.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values only. The test suite mocks every external client; these
      # exist solely to satisfy required Settings fields so the app imports.
      # No real secrets in CI.
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: dummy
      KIMI_API_KEY: dummy
      OPENAI_API_KEY: dummy
      SUPABASE_URL: http://localhost
      SUPABASE_SECRET_KEY: dummy
      SUPABASE_PUBLISHABLE_KEY: dummy
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      # NOTE: dev venv + tests run on 3.12; prod runtime.txt pins 3.11.9 (drift
      # tracked in issue #34). Using 3.12 here to match where the suite is green.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        # `python -m pytest` (not bare `pytest`) so cwd (backend/) lands on
        # sys.path and `import app` resolves — there is no conftest/rootdir hook.
        # Skip the eval-harness test: it imports evals/run_ragas.py (pandas/ragas
        # from the separate backend/evals/requirements.txt). It gets its own gate
        # under issue #20 when the eval deps are wired into CI.
        run: python -m pytest -q --ignore=tests/test_evals_review_fixes.py

  frontend:
    name: frontend · tsc + eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
