name: AutoCoach
options:
  bundleIdPrefix: com.padzy
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
targets:
  AutoCoach:
    type: application
    platform: iOS
    sources:
      - AutoCoach
    entitlements:
      path: AutoCoach/AutoCoach.entitlements
      properties:
        # App Group — shared container for the Phase 4 widget + share extension
        # (design PRD §6.1 / §6.4). Declared now so those targets are unblocked.
        com.apple.security.application-groups:
          - group.com.padzy.autocoach
        # Keychain access group — lets the future extensions read the Supabase
        # session the app stores, instead of each one owning its own login.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.padzy.autocoach
        # Sign in with Apple (design PRD §5.1). Required for the Welcome screen's
        # primary CTA; the token is exchanged with Supabase client-side, so no
        # backend change rides along with this.
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: supabase-swift
        product: Supabase
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: AutoCoach/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Padzy OS / Quiet Brutalism is light-only — lock the trait globally.
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Bundled Padzy OS faces (OFL) — see AutoCoach/Resources/Fonts/.
        # Must live here rather than in INFOPLIST_KEY_*, which has no array form.
        UIAppFonts:
          - SpaceGrotesk-Variable.ttf
          - Inter-Variable.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        # Voice dictation for free-text answers (M2).
        NSMicrophoneUsageDescription: "AutoCoach uses the microphone to dictate your free-text quiz answers."
        NSSpeechRecognitionUsageDescription: "AutoCoach uses speech recognition to transcribe your dictated quiz answers."
        # Resolved at build time from Config.xcconfig (gitignored, never committed).
        # Unresolved in a fresh clone → empty string → app shows a config-missing screen.
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        BACKEND_BASE_URL: "$(BACKEND_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padzy.autocoach
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.2.0"
        SWIFT_STRICT_CONCURRENCY: complete
